# Properties that apply ONLY to tests that opt in with @ActiveProfiles("test").
#
# Why a test profile instead of editing src/main/resources/application.properties?
#   - It keeps production defaults untouched.
#   - It makes the test environment explicit and reviewable.
#
# The datasource itself is NOT configured here on purpose: Testcontainers +
# @ServiceConnection injects spring.datasource.* at runtime, pointing at the
# throw-away PostgreSQL container started by the test class.

# The app has an @RabbitListener. Without this, every integration test would
# try to open an AMQP connection to localhost:5672 and spend time retrying.
# We are testing playback (a read path), so the listener is irrelevant.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# Keep test output focused; SQL logging is useful while debugging, but very
# noisy when running the suite. Flip to true locally when a query misbehaves.
spring.jpa.show-sql=false

# Less noise in test logs.
spring.main.banner-mode=off
logging.level.org.springframework.amqp=WARN
logging.level.org.hibernate.SQL=WARN
