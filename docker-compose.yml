services:
  db:
    image: postgres:16
    container_name: streamera-db
    environment:
      POSTGRES_DB: streamera
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5454:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streamera"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  RabbitMQ:
    container_name: 'message-q'
    image: 'rabbitmq:latest'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=myuser'
    ports:
      - '5672:5672'

volumes:
  db_data: