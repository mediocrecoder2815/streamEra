spring.application.name=streamEra-worker

# Worker has no HTTP server; it only consumes RabbitMQ messages.
spring.main.web-application-type=none

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:myuser}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:secret}

# Storage
aws.region=${AWS_REGION:eu-north-1}
aws.s3.bucket=${AWS_S3_BUCKET:streamera-bucket}

# Let in-flight jobs finish before the process exits.
spring.lifecycle.timeout-per-shutdown-phase=60s
server.port = 8082


# logs
logging.level.root=INFO
logging.level.worker=DEBUG
logging.level.org.springframework.amqp=INFO
logging.file.name=logs/worker.log
